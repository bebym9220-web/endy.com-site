<style>
:root{--bg:#070910;--text:#f7f8fc;--muted:#b3bbcc;--red:#ff354d;--gold:#ffc857}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 20% 0%,#24101a 0,transparent 38%),radial-gradient(ellipse at 90% 100%,#2a2110 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6;display:grid;place-items:center;padding:24px;overflow:hidden}
.box{width:min(560px,100%);text-align:center;border:1px solid #65313e;border-radius:24px;padding:38px 24px 34px;background:radial-gradient(ellipse at 85% 0%,#3a1420 0,#0b0e17 62%);box-shadow:0 20px 60px #ff354d1c;animation:in .7s both}
.lg{position:relative;width:110px;height:110px;margin:0 auto 18px}
.lg img{width:110px;height:110px;border-radius:50%;border:3px solid var(--gold);display:block}
.lg:before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--red);animation:ring 2.4s ease-out infinite}
.name{font-weight:950;letter-spacing:.5px;font-size:15px}
.name small{display:block;color:var(--gold);font-size:11px;letter-spacing:2px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:8px;margin-top:22px;border:1px solid #743044;background:#28111d;border-radius:999px;padding:6px 13px;color:#ffbdc6;font-size:12px;font-weight:800}
.dot{width:8px;height:8px;background:#ffc857;border-radius:50%;box-shadow:0 0 10px #ffc857;animation:blink 1.4s ease-in-out infinite}
h1{font-size:clamp(26px,6.4vw,40px);line-height:1.15;margin:14px 0 8px}
h1 span{background:linear-gradient(90deg,#ff354d,#ffc857,#ff354d);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
p{margin:0;color:var(--muted);font-size:16px}
@keyframes in{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
@keyframes blink{50%{opacity:.3}}
@keyframes shine{to{background-position:200% center}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
</style>
</head>
